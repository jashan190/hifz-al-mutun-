name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Newest GA Xcode on the macos-26 hosted image (iOS 26.5 SDK). Xcode 27 is
  # only on the `xcode-27` preview image so far — see docs/ci.md.
  XCODE_APP: /Applications/Xcode_26.6.app
  PROJECT: HifzAlMutun.xcodeproj
  SCHEME: HifzAlMutun
  SPM_DIR: SourcePackages

jobs:
  content:
    name: Validate content JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalizer self-check
        run: python3 Tools/normalize.py

      - name: Validate matn files
        # Both layouts: bayt list (schemaVersion 1) and pages (schemaVersion 2).
        run: |
          set -euo pipefail
          status=0
          for f in Resources/Content/*.json; do
            python3 Tools/validate_matn.py "$f" || status=1
          done
          exit $status

  test:
    name: Build & unit tests (Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # Shared with docs/ci.md's local command.
          udid=$(python3 .github/scripts/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # WHISPER_E2E is deliberately NOT set: those tests download a 632 MB model.
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation -skipMacroValidation \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TestResults-xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  device-build:
    name: Unsigned device build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ env.XCODE_APP }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ env.XCODE_APP }}-

      - name: Build for generic iOS device (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation -skipMacroValidation \
            -resultBundlePath DeviceBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeviceBuild-xcresult
          path: DeviceBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7
