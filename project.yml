name: HifzAlMutun

# This file is the single source of truth for the Xcode project.
# After editing it, regenerate with:  xcodegen generate
# Then open:                          open HifzAlMutun.xcodeproj
# The generated .xcodeproj is disposable — never edit it by hand.

options:
  bundleIdPrefix: com.farhan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Team and bundle id prefix come from Config/Signing.xcconfig, which pulls in
# a git-ignored Config/Local.xcconfig for running on your own device.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"      # iPhone for now
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HifzAlMutun:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      # XcodeGen auto-classifies file types: .swift -> Compile Sources,
      # .json -> Copy Bundle Resources. We mark this one explicitly so the
      # bundled content is unmistakable.
      - path: Resources/Content
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hifzalmutun
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "حفظ المتون"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used to listen as you recite, so the app can follow along and reveal the text."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used to recognise your recitation on-device so the app can track your place in the poem."

  HifzAlMutunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "SpeechTests/Fixtures/**"
      - path: Tests/SpeechTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: HifzAlMutun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hifzalmutun.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HifzAlMutun:
    build:
      targets:
        HifzAlMutun: all
        HifzAlMutunTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HifzAlMutunTests
