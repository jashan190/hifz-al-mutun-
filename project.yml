name: HifzAlMutun

# This file is the single source of truth for the Xcode project.
# After editing it, regenerate with:  xcodegen generate
# Then open:                          open HifzAlMutun.xcodeproj
# The generated .xcodeproj is disposable — never edit it by hand.

options:
  bundleIdPrefix: com.farhan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # set this to your Apple team id when you run on device
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"      # iPhone for now
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HifzAlMutun:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      # XcodeGen auto-classifies file types: .swift -> Compile Sources,
      # .json -> Copy Bundle Resources. We mark this one explicitly so the
      # bundled content is unmistakable.
      - path: Resources/Content
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farhan.hifzalmutun
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "حفظ المتون"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
