name: HifzAlMutun

# This file is the single source of truth for the Xcode project.
# After editing it, regenerate with:  xcodegen generate
# Then open:                          open HifzAlMutun.xcodeproj
# The generated .xcodeproj is disposable — never edit it by hand.

options:
  bundleIdPrefix: com.farhan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Team and bundle id prefix come from Config/Signing.xcconfig, which pulls in
# a git-ignored Config/Local.xcconfig for running on your own device.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HifzAlMutun:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      # XcodeGen auto-classifies file types: .swift -> Compile Sources,
      # .json -> Copy Bundle Resources. We mark this one explicitly so the
      # bundled content is unmistakable.
      - path: Resources/Content
        buildPhase: resources
      # Each matn's expected phonemes, for the vowel check (not matn content:
      # CI validates every JSON in Resources/Content as a matn).
      - path: Resources/Phonemes
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hifzalmutun
        # iPhone only. Must be set at the target level: XcodeGen injects a
        # default of "1,2" on app targets that overrides any project-level value.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Managed Info.plist (App/Info.plist) rather than GENERATE_INFOPLIST_FILE.
        # The generator only wrote CFBundleIconName nested inside CFBundleIcons;
        # App Store validation (error 90713) needs it at the top level, which the
        # managed plist sets directly. All former INFOPLIST_KEY_* values live there.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist

  HifzAlMutunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "SpeechTests/Fixtures/**"
      - path: Tests/SpeechTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: HifzAlMutun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).hifzalmutun.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HifzAlMutun:
    build:
      targets:
        HifzAlMutun: all
        HifzAlMutunTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HifzAlMutunTests
